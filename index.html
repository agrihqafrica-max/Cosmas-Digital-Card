<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cosmas T. Mwangi | Haki Navigator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f5f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #17243a;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 18px 10px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      min-height: calc(100vh - 36px);
      background: #ffffff;
      border-radius: 34px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      padding: 28px 22px 24px;
    }

    /* =========================
       TOP
    ========================== */

    .top {
      position: relative;
      text-align: center;
      padding-top: 4px;
    }

    .haki-logo {
      display: block;
      width: min(285px, 70%);
      height: auto;
      margin: 0 auto;
    }

    /* Your photo is deliberately small and top-right */
    .profile-photo {
      position: absolute;
      top: 2px;
      right: 0;
      width: 78px;
      height: 78px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .tagline {
      margin-top: 8px;
      color: #35a853;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* Decorative line with star */
    .decoration {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 10px auto 20px;
      width: 82%;
    }

    .decoration-line {
      height: 2px;
      flex: 1;
      background: #35a853;
    }

    .star {
      color: #35a853;
      font-size: 13px;
      line-height: 1;
    }

    /* =========================
       NAME
    ========================== */

    .identity {
      text-align: center;
      margin-bottom: 22px;
    }

    .name {
      margin: 0;
      color: #071f49;
      font-size: clamp(26px, 7vw, 39px);
      line-height: 1.05;
      font-weight: 700;
      white-space: nowrap;
    }

    .green-underline {
      width: 90px;
      height: 3px;
      background: #35a853;
      margin: 10px auto 12px;
    }

    .role {
      margin: 0;
      color: #17243a;
      font-size: 17px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .company {
      margin-top: 4px;
      color: #17243a;
      font-size: 16px;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* =========================
       SAVE CONTACT
    ========================== */

    .save-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      width: 92%;
      min-height: 74px;
      margin: 0 auto;

      background: #071f49;
      color: #ffffff;

      border-radius: 20px;
      text-decoration: none;

      font-size: 23px;
      font-weight: 700;
      letter-spacing: 0.2px;

      box-shadow:
        0 5px 12px rgba(7, 31, 73, 0.20);

      transition: transform 0.15s ease;
    }

    .save-contact:active {
      transform: scale(0.98);
    }

    /* White contact-card icon */
    .contact-icon {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 6px;
      position: relative;
      flex-shrink: 0;
    }

    .contact-icon::before {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      background: #071f49;
      border-radius: 50%;
      top: 7px;
      left: 13px;
    }

    .contact-icon::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 9px;
      background: #071f49;
      border-radius: 10px 10px 4px 4px;
      bottom: 7px;
      left: 9px;
    }

    .save-subtitle {
      text-align: center;
      color: #4e5968;
      font-size: 13px;
      margin: 8px 0 18px;
      white-space: nowrap;
    }

    /* =========================
       CONTACT / SOCIAL GRID
    ========================== */

    .links-grid {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }

    /* First row = 4 */
    .contact-row {
      grid-template-columns: repeat(4, 1fr);
    }

    /* Second row = 3 */
    .social-row {
      grid-template-columns: repeat(3, 1fr);
      width: 78%;
      margin-left: auto;
      margin-right: auto;
      margin-top: 10px;
    }

    .link {
      min-width: 0;
      min-height: 96px;

      background: #ffffff;
      border: 1px solid #edf0f3;
      border-radius: 22px;

      text-decoration: none;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 7px;

      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.045);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .link:active {
      transform: scale(0.97);
    }

    .icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1;
    }

    /* =========================
       CALL
    ========================== */

    .call-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;

      color: #123f78;
      font-size: 32px;
      font-weight: 700;

      transform: rotate(-18deg);
    }

    .call .label {
      color: #123f78;
    }

    /* =========================
       PLATFORM COLORS
    ========================== */

    .whatsapp .label {
      color: #25D366;
    }

    .email .label {
      color: #EA4335;
    }

    .website .label {
      color: #071f49;
    }

    .linkedin .label {
      color: #0A66C2;
    }

    .x .label {
      color: #111111;
    }

    .youtube .label {
      color: #FF0000;
    }

    /* =========================
       BOTTOM TAGLINE
    ========================== */

    .bottom-decoration {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 20px auto 10px;
      width: 70%;
    }

    .bottom-line {
      height: 2px;
      flex: 1;
      background: #35a853;
    }

    .bottom-text {
      text-align: center;
      color: #17243a;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      margin: 0;
    }

    /* =========================
       SMALL PHONES
    ========================== */

    @media (max-width: 430px) {

      body {
        padding: 8px 5px;
      }

      .card {
        min-height: calc(100vh - 16px);
        border-radius: 26px;
        padding: 22px 12px 18px;
      }

      .haki-logo {
        width: 245px;
        max-width: 68%;
      }

      .profile-photo {
        width: 64px;
        height: 64px;
        right: 2px;
        top: 0;
      }

      .tagline {
        font-size: 11px;
        margin-top: 7px;
      }

      .decoration {
        margin-top: 8px;
        margin-bottom: 16px;
        width: 88%;
      }

      .identity {
        margin-bottom: 17px;
      }

      .name {
        font-size: 27px;
      }

      .green-underline {
        width: 70px;
        height: 2px;
        margin: 8px auto 9px;
      }

      .role {
        font-size: 14px;
      }

      .company {
        font-size: 13px;
      }

      .save-contact {
        width: 96%;
        min-height: 62px;
        border-radius: 17px;
        font-size: 19px;
        gap: 10px;
      }

      .contact-icon {
        width: 31px;
        height: 31px;
      }

      .contact-icon::before {
        width: 9px;
        height: 9px;
        top: 6px;
        left: 11px;
      }

      .contact-icon::after {
        width: 17px;
        height: 8px;
        bottom: 6px;
        left: 7px;
      }

      .save-subtitle {
        font-size: 11px;
        margin-top: 6px;
        margin-bottom: 13px;
      }

      .links-grid {
        gap: 7px;
      }

      .contact-row {
        grid-template-columns: repeat(4, 1fr);
      }

      .social-row {
        width: 82%;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 7px;
      }

      .link {
        min-height: 76px;
        border-radius: 17px;
        gap: 5px;
      }

      .icon {
        width: 27px;
        height: 27px;
      }

      .call-icon {
        width: 27px;
        height: 27px;
        font-size: 27px;
      }

      .label {
        font-size: 10px;
      }

      .bottom-decoration {
        margin-top: 14px;
        margin-bottom: 8px;
      }

      .bottom-text {
        font-size: 11px;
      }
    }
  </style>
</head>

  <script>
    // Fetch the vCard file and prepare it for cross-platform vCard handling
    document.getElementById('saveContactBtn').addEventListener('click', async function(e) {
      e.preventDefault();
      
      try {
        // Fetch the vCard file
        const response = await fetch('Cosmas_T_Mwangi.vcf');
        if (!response.ok) {
          throw new Error('Failed to load vCard');
        }
        const vcardContent = await response.text();
        
        // Create a data URI with text/vcard MIME type
        const dataUri = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcardContent);
        
        // Create and trigger download with proper filename
        const link = document.createElement('a');
        link.href = dataUri;
        link.download = 'Cosmas_T_Mwangi.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (error) {
        console.error('Error handling vCard:', error);
        alert('Unable to load contact. Please try again.');
      }
    });
  </script>
